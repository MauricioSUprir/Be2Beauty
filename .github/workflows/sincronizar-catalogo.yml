name: Sincronizar catálogo do Hub

# Robô diário da Be2Beauty: pega o código-fonte no repositório "teste",
# baixa o catálogo do Hub (via servidor no Render), sincroniza e republica
# este site (www.be2beauty.com.br) com produtos, marcas e fotos novos.
# Roda meia hora depois do robô do BeautyNow — o servidor já está acordado
# e com a coleta do dia pronta.

on:
  schedule:
    - cron: "30 9 * * *" # 06:30 no horário de Brasília, todo dia
  workflow_dispatch: {}
  push:
    paths:
      - ".github/disparar-sincronizacao.txt"

permissions:
  contents: write

concurrency:
  group: sincronizar-catalogo
  cancel-in-progress: false

env:
  SERVIDOR: https://beautynow-servidor.onrender.com
  CHAVE: exporta-bn-2026

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      # este próprio repositório — para preservar .github e CNAME no deploy
      - uses: actions/checkout@v4

      # código-fonte da loja (repositório teste, branch de trabalho)
      - uses: actions/checkout@v4
        with:
          repository: MauricioSUprir/teste
          ref: claude/beauty-now-ecommerce-fbfxh2
          path: fonte

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar catálogo do Hub (via servidor)
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SERVIDOR/saude" || echo 000)
            [ "$code" = "200" ] && break
            echo "acordando servidor… ($i)"
            sleep 10
          done
          # usa a coleta já pronta do dia; se não houver, inicia uma
          for i in $(seq 1 90); do
            curl -s -L "$SERVIDOR/exportar-catalogo/baixar?chave=$CHAVE" -o catalogo-hub.json || true
            if jq -e '.brutos | length > 900' catalogo-hub.json >/dev/null 2>&1; then
              echo "catálogo pronto: $(jq '.brutos | length' catalogo-hub.json) produtos"
              break
            fi
            [ "$i" = "1" ] && curl -s "$SERVIDOR/exportar-catalogo?chave=$CHAVE" -o /dev/null
            # o Hub às vezes dá 502 no meio da coleta — a cada 2 min sem
            # resultado, manda refazer (inofensivo se ainda estiver coletando)
            if [ $((i % 12)) -eq 0 ]; then
              echo "sem resultado ainda — pedindo nova coleta (refazer)…"
              curl -s "$SERVIDOR/exportar-catalogo?chave=$CHAVE&refazer=1" -o /dev/null
            fi
            echo "aguardando coleta… ($i)"
            sleep 10
          done
          jq -e '.brutos | length > 900' catalogo-hub.json >/dev/null

      - name: Sincronizar e verificar se há novidade
        id: diff
        run: |
          set -e
          cd fonte
          npm ci
          node scripts/sincronizar-catalogo.mjs "$GITHUB_WORKSPACE/catalogo-hub.json"
          jq 'del(.atualizadoEm)' apps/storefront/src/lib/catalogo/dados-hub.json | sha256sum | cut -d" " -f1 > /tmp/versao-nova
          # o site publicado guarda a versão do catálogo em catalogo-versao.txt
          if [ -f "$GITHUB_WORKSPACE/catalogo-versao.txt" ] && cmp -s /tmp/versao-nova "$GITHUB_WORKSPACE/catalogo-versao.txt"; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada novo no Hub hoje — nada a publicar."
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
            echo "Catálogo mudou — vou rebuildar e publicar."
          fi

      - name: Build do site Be2Beauty
        if: steps.diff.outputs.mudou == 'sim'
        run: |
          cd fonte
          STATIC_EXPORT=1 NEXT_PUBLIC_LOJA=be2beauty NEXT_PUBLIC_SERVIDOR_URL="$SERVIDOR" npm run build --workspace=@beautynow/storefront

      - name: Publicar no GitHub Pages
        if: steps.diff.outputs.mudou == 'sim'
        run: |
          set -e
          mkdir -p /tmp/site
          cp -r fonte/apps/storefront/out/. /tmp/site/
          # preserva o robô e o domínio deste repositório
          cp -r .github /tmp/site/.github
          echo "www.be2beauty.com.br" > /tmp/site/CNAME
          cp /tmp/versao-nova /tmp/site/catalogo-versao.txt
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "robo-catalogo"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publicação automática após sincronização do catálogo"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
          echo "Site republicado com o catálogo novo."
